# Site Netlify courant : ariafirstversion
# https://ariafirstversion.netlify.app
# Dépôt de référence : ariatestversion/Aria- (déploiements par prévisualisation, prod après validation)

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
